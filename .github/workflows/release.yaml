name: Release
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) created by release-please
        type: string
        required: true
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
permissions: {}
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}
      - name: Tag must match Helm chart appVersion
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          chart=$(sed -n 's/^appVersion: "\(.*\)".*/\1/p' deploy/helm/kaflux/Chart.yaml)
          [ "v$chart" = "$TAG" ] || { echo "tag $TAG != chart appVersion v$chart"; exit 1; }
      # latest moves only when this tag is the highest stable version, so patching an old line never rolls it back.
      - id: latest
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          highest=$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY" 'v*' | sed 's|.*refs/tags/||' | grep -Ev -- '-' | sort -V | tail -1)
          [ "$highest" = "$TAG" ] && echo "is_latest=true" >> "$GITHUB_OUTPUT" || echo "is_latest=false" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || 'v0.0.0' }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || 'v0.0.0' }},enable=${{ inputs.tag != '' && !contains(inputs.tag, '-') }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.is_latest == 'true' }}
            type=ref,event=branch,enable=${{ inputs.tag == '' && github.ref_name == 'main' }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=kaflux
      # Stage 1: push by digest under the immutable sha tag only. Public tags are applied after the scan passes.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      # Stage 2: scan passed; add the public tags to the same digest (no rebuild).
      - name: Apply public tags to the scanned digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          args=()
          while read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image digest (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published \`$IMAGE@$DIGEST\`"
            echo '```'; echo "$TAGS"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
