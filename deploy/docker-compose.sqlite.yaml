# Single-instance durable deployment; no PostgreSQL service is required.
# Run from repository root with docker compose -f deploy/docker-compose.sqlite.yaml up --build.
services:
  kaflux:
    build: ..
    image: ghcr.io/hawxxx/kaflux:${KAFLUX_VERSION:-0.10.0} # x-release-please-version
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFLUX_LISTEN: ":8080"
      KAFLUX_CONFIG: /app/config.yaml
      KAFLUX_STORAGE_BACKEND: sqlite
      KAFLUX_SQLITE_PATH: /var/lib/kaflux/kaflux.db
      KAFLUX_DEMO: "false"
      KAFLUX_ADMIN_USER: ${KAFLUX_ADMIN_USER:-admin}
      KAFLUX_ADMIN_PASSWORD_HASH: ${KAFLUX_ADMIN_PASSWORD_HASH:?Set KAFLUX_ADMIN_PASSWORD_HASH to a bcrypt hash}
      KAFLUX_PROMETHEUS_URL: ${KAFLUX_PROMETHEUS_URL:-}
      # MCP server for AI agents at /mcp (off by default; see runtime.mcp in
      # config.example.yaml). Uncomment to pass settings through from .env.
      # KAFLUX_MCP_ENABLED: ${KAFLUX_MCP_ENABLED:-false}
      # KAFLUX_MCP_WRITES: ${KAFLUX_MCP_WRITES:-disabled}
      # KAFLUX_MCP_ALLOWED_ORIGINS: ${KAFLUX_MCP_ALLOWED_ORIGINS:-}
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      - kaflux-data:/var/lib/kaflux
    healthcheck:
      # The image is distroless, so the binary probes its own /health endpoint.
      test: [CMD, /app/kaflux, healthcheck]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  kaflux-data:
