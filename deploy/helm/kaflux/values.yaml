replicaCount: 1
storage:
  backend: postgres
  sqlite:
    path: /var/lib/kaflux/kaflux.db
    existingClaim: ""
    size: 1Gi
    # Block-storage class such as an EBS gp3 class. Use one with volumeBindingMode
    # WaitForFirstConsumer so the volume is created in the zone where the pod lands.
    storageClass: ""
    # PVC annotations, e.g. helm.sh/resource-policy: keep to retain data on uninstall.
    annotations: {}
image:
  repository: ghcr.io/hawxxx/kaflux
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
extraVolumes: []
extraVolumeMounts: []
serviceAccount:
  create: true
  name: ""
  annotations: {}
service:
  type: ClusterIP
  port: 8080
ingress:
  enabled: false
  className: ""
  # With mcp.enabled and more than one replica, route each MCP token to one pod
  # (write confirmations are per-process), for example with ingress-nginx:
  #   nginx.ingress.kubernetes.io/upstream-hash-by: "$http_authorization"
  # Cookie affinity does not help: MCP clients send no cookies.
  annotations: {}
  host: kaflux.example.invalid
  tls: []
config:
  demo: false
  # Keep the build version off the unauthenticated sign-in page.
  hideVersion: false
  prometheusURL: ""
  # Connection metadata only; credentials resolve from secret environment variables.
  clusters: []
configuration:
  # Strict runtime YAML; provider client secrets must use environment references.
  oidc: []
  ldap: []
  grants: []
  integrations: []
# MCP server for AI agents at POST /mcp, authenticated by scoped kfx_ tokens.
# Off by default; while off, /mcp answers 404. See runtime.mcp in
# config.example.yaml.
mcp:
  enabled: false
  # disabled | enabled. Write tools also need a token with the write or
  # destructive scope, and every write needs a confirmation call.
  writes: disabled
  # Browser origins (scheme://host[:port], no path) allowed to call /mcp.
  # Non-browser clients send no Origin and are unaffected; empty refuses every
  # browser-originated request.
  allowedOrigins: []
  maxResponseBytes: 262144 # 4096-16777216
  callTimeoutSeconds: 30 # 1-300
  rateLimitPerMinute: 120 # per token, 1-6000
  concurrencyPerToken: 4 # per token, 1-64
secrets:
  existingSecret: kaflux-runtime
  databaseURLKey: database-url
  adminUserKey: admin-user
  adminPasswordHashKey: admin-password-hash
  extraEnv: []
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "2"
    memory: 512Mi
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
podDisruptionBudget:
  # With a single replica, minAvailable: 1 blocks node drains and spot/consolidation
  # replacements. Use replicaCount >= 2 before enabling it.
  enabled: false
  minAvailable: 1
networkPolicy:
  enabled: true
  # Replace permissive outbound defaults with known DB, Kafka and metrics peers.
  egress:
    - {}
# Scheduling. Kaflux is stateless with the postgres backend (e.g. RDS: put the
# full URL, with sslmode, in the secret's database-url key), so it tolerates
# spot or preemptible nodes. SQLite is pinned to one pod and one volume zone;
# prefer on-demand nodes for it.
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
# Seconds allowed for graceful shutdown. Leave 0 for the Kubernetes default (30);
# keep it above the cloud's spot interruption notice handling if you set it.
terminationGracePeriodSeconds: 0
podAnnotations: {}
podLabels: {}
