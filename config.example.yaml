# Copy to private config.yaml; set KAFLUX_CONFIG to its path if needed.
# Environment variables override these settings. Optional JSON cluster array
# configuration remains supported through KAFLUX_CLUSTERS_FILE.
# Keep config.yaml, clusters.json and .env private. Secret values belong in env
# or Kubernetes Secrets. The Helm chart exposes these settings as values.
runtime:
  listen: ":8080" # KAFLUX_LISTEN
  staticDirectory: /app/frontend # KAFLUX_STATIC_DIR
  demo: false # KAFLUX_DEMO; opt in to backend simulation
  storageBackend: sqlite # KAFLUX_STORAGE_BACKEND; postgres for multiple replicas
  sqlitePath: /var/lib/kaflux/kaflux.db # KAFLUX_SQLITE_PATH; mount the directory
  # For postgres replace storageBackend and uncomment the secret reference:
  # databaseURLEnv: KAFLUX_DATABASE_URL
  adminUserEnv: KAFLUX_ADMIN_USER
  adminPasswordHashEnv: KAFLUX_ADMIN_PASSWORD_HASH # bcrypt
  prometheusURLEnv: KAFLUX_PROMETHEUS_URL
clusters:
  - id: local
    name: Local integration
    environment: development
    seeds: [kafka:9092]
    tls: false # Local Compose only; use TLS for remote clusters.
    allowPlaintext: true # Explicit local-only transport opt-in.
    sasl: ""
    user: ""
    passwordEnv: KAFLUX_KAFKA_PASSWORD
    # Optional. Reject rebalance execution without a replication throttle on this
    # cluster. Without it the plan form's throttle switch may be turned off.
    # requireThrottle: true
    # Optional. What one broker is meant to hold, from your own sizing. Needed for
    # self-managed Kafka, where no broker type can be read. Amazon MSK clusters are
    # resolved automatically (see below); this block overrides their published limits.
    # capacity:
    #   label: r6i.4xlarge
    #   partitionsPerBroker: {recommended: 4000, maximum: 6000}
    #   diskBytesPerBroker: 4398046511104
# For a real MSK entry set region, SASL msk-iam (or configured SCRAM/TLS),
# optional roleArn, and mskClusterArn. Manual reassignment must check ACTIVE
# cluster state and is blocked when the state cannot be verified. mskClusterArn
# can be left unset when every seed is an MSK bootstrap broker hostname
# (b-<n>.<cluster-name>.<id>.c<generation>.kafka.<region>.amazonaws.com):
# Kaflux then discovers the ARN itself via kafka:ListClustersV2, as long as
# exactly one cluster's name and generation match. Discovery is lazy and
# cached, and never blocks startup; set mskClusterArn explicitly if discovery
# cannot find a unique match, or to skip the extra AWS call.
# Grants give roles actions. cluster and pattern default to "*"; pattern matches
# the topic, group or subject name (glob, or regex with regex: true). Actions:
# read consume produce create delete alter-config reset-offsets rename plan
# execute rollback manage-acls schema-read schema-update connector-read
# connector-update audit manage-sessions, or "*". The local admin account always
# has the administrator role. See docs/authentication.md#roles-and-grants.
grants:
  - {role: administrator, action: "*"}
  # Read-only: browse everything, change nothing, cannot read message payloads.
  - {role: viewer, action: read}
  - {role: viewer, action: schema-read}
  - {role: viewer, action: connector-read}
  - {role: operator, action: read}
  - {role: operator, action: consume}
  - {role: operator, action: plan}
  - {role: operator, action: schema-read}
  - {role: operator, action: connector-read}
# Enable only with an authorized tenant and pre-created confidential client.
# The redirect path must be /api/v1/auth/oidc/<id>/callback. Copy issuer exactly
# from the provider's discovery document (Authentik keeps the trailing slash).
# oidc:
#   - id: authentik
#     name: Authentik
#     issuer: https://identity.example.invalid/application/o/kaflux/
#     clientId: kaflux
#     clientSecretEnv: KAFLUX_OIDC_SECRET
#     redirectURL: https://console.example.invalid/api/v1/auth/oidc/authentik/callback
#     groupClaim: groups
#     # scopes: [groups]   # extra scopes, e.g. Okta needs "groups"
#     groupRoles:
#       kafka-admins: [administrator]
#       kafka-operators: [operator]
#       kafka-viewers: [viewer]
#     # defaultRoles: [viewer]   # every verified user; omit to deny unmapped users
# ldap:
#   - id: directory
#     url: ldaps://directory.example.invalid:636
#     # caFile: /etc/kaflux/ldap-ca.pem   # private CA for the directory certificate
#     bindDN: cn=kaflux,ou=services,dc=example,dc=invalid
#     bindPasswordEnv: KAFLUX_LDAP_BIND_PASSWORD
#     baseDN: ou=people,dc=example,dc=invalid
#     userFilter: '(sAMAccountName={username})'
#     groupAttribute: memberOf
#     groupRoles:   # group DNs match case-insensitively
#       cn=kafka-operators,ou=groups,dc=example,dc=invalid: [operator]
#       cn=kafka-viewers,ou=groups,dc=example,dc=invalid: [viewer]
